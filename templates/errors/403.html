{% extends "base.html" %}

{% block content %}
<div class="error-page-wrapper">
    <div class="error-card">
        <span class="error-code">403</span>
        <h1 class="error-title">Access Forbidden</h1>
        <p class="error-description">
            You do not have permission to access or modify this resource. Only authorized users or owners can perform this action.
        </p>
        <div class="error-actions">
            <a href="{{ url_for('home') }}" class="btn-primary">Return Home</a>
            <a href="{{ url_for('dashboard') }}" class="btn-outline">Go to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
